[package]
name = "ilocation"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
description = "Simulate GPS locations and replay GPX routes on a USB-connected iPhone"
license = "MIT"
repository = "https://github.com/BugenZhao/ilocation"
readme = "README.md"
keywords = ["ios", "iphone", "gps", "location", "gpx"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "examples/**", "docs/**", "skills/**"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
gpx = "0.10.0"
idevice = { version = "0.1.65", features = ["core_device_proxy", "dvt", "location_simulation", "rsd", "tcp", "tunnel_tcp_stack", "tunneld", "usbmuxd"] }
time = "0.3.55"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
