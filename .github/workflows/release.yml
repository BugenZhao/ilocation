name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must match stable Cargo version v{version}')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'RELEASE_VERSION={version}\n')
          PY
          test "$(uname -m)" = arm64

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy --target aarch64-apple-darwin

      - name: Check and build
        run: |
          cargo +1.94.0 fmt --check
          cargo +1.94.0 test --release --locked
          cargo +1.94.0 clippy --release --locked --all-targets -- -D warnings
          cargo +1.94.0 build --release --locked --target aarch64-apple-darwin
          target/aarch64-apple-darwin/release/ilocation --version
          target/aarch64-apple-darwin/release/ilocation search --help

      - name: Package macOS arm64 binary
        shell: bash
        run: |
          set -euo pipefail
          bundle="ilocation-${RELEASE_TAG}-aarch64-apple-darwin"
          mkdir -p "dist/$bundle"
          cp target/aarch64-apple-darwin/release/ilocation README.md LICENSE "dist/$bundle/"
          cp -R examples "dist/$bundle/"
          tar -czf "dist/$bundle.tar.gz" -C dist "$bundle"
          cd dist
          shasum -a 256 "$bundle.tar.gz" > "$bundle.tar.gz.sha256"

      - name: Check crates.io version
        id: registry
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          version = os.environ['RELEASE_VERSION']
          req = urllib.request.Request(f'https://crates.io/api/v1/crates/ilocation/{version}', headers={'User-Agent': 'ilocation-release (github.com/BugenZhao/ilocation)'})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()
              published = 'true'
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'published={published}\n')
          PY

      - name: Authenticate with crates.io
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.94.0 publish --locked

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
              --verify-tag --title "ilocation $RELEASE_TAG" --generate-notes
          fi
